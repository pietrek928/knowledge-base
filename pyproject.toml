[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "knowledge-base"
version = "0.1.0"
description = "Local FastAPI knowledge base with hybrid lexical+vector search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "granian>=1.6",
  "orjson>=3.10",
  "numpy>=2.0",
  "anyascii>=0.3",
  "tree-sitter>=0.23",
  "tree-sitter-language-pack>=0.7",
  "pydantic>=2.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.11"]

[project.scripts]
kb = "knowledge_base.cli:main"

[tool.scikit-build]
cmake.build-type = "Release"
build.verbose = true
wheel.packages = ["src/knowledge_base"]

[tool.scikit-build.cmake.define]
NOMINSIZE = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "bench: heavier corpus benchmarks (deselect with -m 'not bench')",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
mypy_path = "src"
packages = ["knowledge_base"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "mypy>=1.11"]
